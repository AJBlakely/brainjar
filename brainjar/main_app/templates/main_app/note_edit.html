{% extends 'main_app/base.html' %}

{% block content %}
<div class="container">
  <div class="card">
    <h1 style="margin-bottom:1.5rem;">Edit Note</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="action-row" style="margin-top:1.5rem;margin-bottom:0;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'topic_detail' note.topic.pk %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
