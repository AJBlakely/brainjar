<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrainJar</title>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">BrainJar</a>
    {% if user.is_authenticated %}
      | <a href="{% url 'topic_index' %}">My Topics</a>
      | <a href="{% url 'topic_create' %}">+ New Topic</a>
      | <span>{{ user.username }}</span>
      | <a href="{% url 'logout' %}">Logout</a>
    {% else %}
      | <a href="{% url 'login' %}">Login</a>
      | <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
